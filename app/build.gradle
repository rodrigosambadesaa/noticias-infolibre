plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.muyinteresante'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.rodrigosambade.noticias.infolibre"
        minSdkVersion 16
        targetSdkVersion 35
        versionCode 19
        versionName "1.1.17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // This release still uses the legacy support library because the app
        // supports API 16; migration to AndroidX is a separate change.
        disable 'GradleCompatible'
    }
}

dependencies {
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
