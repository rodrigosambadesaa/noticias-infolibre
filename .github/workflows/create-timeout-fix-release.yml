name: Publish timeout fix release

on:
  push:
    paths:
      - '.github/workflows/create-timeout-fix-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release_notes.md <<'EOF'
          - Se han eliminado los timeouts infinitos (`0`) en la conexión HTTP de `DescargaNoticiasRSS`.

          - Se establece un ConnectTimeout de 15s y un ReadTimeout de 30s.
          - Esto soluciona un memory leak potencial y bloqueos en la interfaz (ProgressDialog eterno) cuando el usuario pierde la cobertura o transiciona entre redes sin cierre limpio de socket. Ahora el sistema detecta correctamente el fallo y lanza el diagnóstico reactivo de red.
          EOF
          gh release create v1.1.14 \
            --repo "$GITHUB_REPOSITORY" \
            --target 4714f95837798ac0a5e981bc9c149713b451a803 \
            --title "Fix: Prevención de bloqueos por pérdida silenciosa de red (Agujero negro TCP)" \
            --notes-file release_notes.md
