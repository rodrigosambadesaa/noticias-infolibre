name: Security hardening release
on:
  push:
    paths: ['.github/workflows/security-hardening-release.yml']
permissions:
  contents: write
jobs:
  harden-build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Apply security hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('app/src/main/java'); xxe=0; prints=0
          for p in root.rglob('*.java'):
              s=p.read_text(encoding='utf-8'); old=s
              n=s.count('e.printStackTrace();')
              if n:
                  s=s.replace('e.printStackTrace();','android.util.Log.e("SecurityLog", "Excepción capturada de forma segura", e);'); prints+=n
              if 'DocumentBuilderFactory' in s and 'http://apache.org/xml/features/disallow-doctype-decl' not in s and 'dbf.setCoalescing(true);' in s:
                  marker='dbf.setCoalescing(true);'; pos=s.index(marker); start=s.rfind('\n',0,pos)+1; indent=s[start:pos]; end=pos+len(marker)
                  b='\n'+indent+'try {\n'+indent+'    dbf.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);\n'+indent+'    dbf.setFeature("http://xml.org/sax/features/external-general-entities", false);\n'+indent+'    dbf.setFeature("http://xml.org/sax/features/external-parameter-entities", false);\n'+indent+'} catch (Exception e) {\n'+indent+'    android.util.Log.w("XML_SEC", "El parser no soporta las configuraciones de seguridad XXE", e);\n'+indent+'}'
                  s=s[:end]+b+s[end:]; xxe+=1
              if s!=old: p.write_text(s,encoding='utf-8')
          mpath=Path('app/src/main/AndroidManifest.xml'); m=mpath.read_text(encoding='utf-8'); a=re.search(r'<application\b[^>]*>',m,re.S)
          if not a: raise SystemExit('No application tag')
          tag=a.group(0)
          tag=re.sub(r'android:usesCleartextTraffic\s*=\s*"[^"]*"','android:usesCleartextTraffic="false"',tag) if 'android:usesCleartextTraffic=' in tag else tag.replace('<application','<application\n        android:usesCleartextTraffic="false"',1)
          mpath.write_text(m[:a.start()]+tag+m[a.end():],encoding='utf-8')
          gpath=Path('app/build.gradle'); g=gpath.read_text(encoding='utf-8'); cm=re.search(r'versionCode\s+(\d+)',g)
          if not cm: raise SystemExit('No versionCode')
          g=re.sub(r'versionCode\s+\d+',f'versionCode {int(cm.group(1))+1}',g,count=1); g=re.sub(r'versionName\s+"[^"]+"','versionName "1.1.15"',g,count=1); gpath.write_text(g,encoding='utf-8')
          if xxe<1 or prints<1: raise SystemExit(f'Parche incompleto xxe={xxe} prints={prints}')
          if any('e.printStackTrace();' in p.read_text(encoding='utf-8') for p in root.rglob('*.java')): raise SystemExit('Quedan printStackTrace')
          PY
          grep -R --include='*.java' -q 'disallow-doctype-decl' app/src/main/java
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          git diff --check
      - name: Commit and push security patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/src/main/AndroidManifest.xml app/build.gradle
          git commit -m "sec: bastionado XXE, eliminación de printStackTrace y bloqueo de tráfico HTTP en claro"
          echo "SEC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Build APK
        run: chmod +x gradlew && ./gradlew --no-daemon clean assembleRelease && test -f app/build/outputs/apk/release/app-release.apk
      - name: Create release and attach APK
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cat > release_notes.md <<'EOF'
          - 🔒 Mitigación XXE: Se han deshabilitado las entidades externas (DTDs) en el parser XML para prevenir lectura de archivos locales.
          * 🔒 Information Leakage: Se ha eliminado printStackTrace() a favor del sistema de Logs cifrado de Android.
          * 🔒 Network Security: Se bloquea estrictamente cualquier tráfico HTTP no cifrado a nivel de Manifest (usesCleartextTraffic).
          EOF
          git tag v1.1.15 "$SEC_SHA" && git push origin refs/tags/v1.1.15
          gh release create v1.1.15 --repo "$GITHUB_REPOSITORY" --target "$SEC_SHA" --title "Security Update: Prevención XXE y Endurecimiento de Red" --notes-file release_notes.md
          gh release upload v1.1.15 app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --clobber
